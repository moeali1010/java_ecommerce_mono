spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3306/java_ecommerce_mono?useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  messages:
    basename: messages
    encoding: UTF-8

